name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately absent: the official CLI installer
        # (cli.moonbitlang.com/install/unix.sh) supports macOS and Linux only, and
        # the published Windows artifacts are not fetchable by URL.
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4

      # Version-pinned archives under /binaries/<version>/ currently return 403,
      # so only the rolling installer works. The consequence for the fmt gate is
      # handled in its own step below rather than left implicit.
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: Check
        run: moon check --target ${{ matrix.target }}

      # Formatting rules legitimately change between toolchain releases, and CI
      # cannot install the same build this repository was formatted with (see the
      # install step). A hard gate here would fail on external drift rather than
      # on a defect in this code, so it reports without blocking. The
      # `conformance` job still compares generated code semantically.
      - name: Format check (informational)
        continue-on-error: true
        run: moon fmt --check

      - name: Test
        run: moon test --target ${{ matrix.target }}

      - name: Build
        run: moon build --target ${{ matrix.target }}

  conformance:
    name: conformance evidence is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The corpus must be derivable from the RFC by the committed tool. This is
      # what makes the "external evidence" claim checkable on every push instead
      # of asserted once.
      - name: Re-extract from rfc-editor.org and compare
        shell: bash
        run: |
          curl -fsSL https://www.rfc-editor.org/rfc/rfc4475.txt -o /tmp/rfc4475.txt
          python3 tools/extract_rfc4475.py --rfc /tmp/rfc4475.txt --out-dir /tmp
          python3 - <<'PY'
          import json
          fresh = json.load(open('/tmp/rfc4475_vectors.json'))
          committed = json.load(open('rfc4475_vectors.json'))
          assert fresh == committed, "extractor output differs from the committed vector set"
          ids = [v['id'] for v in fresh]
          assert len(ids) == 49, f"expected 49 vectors, got {len(ids)}"
          print(f"{len(ids)} vectors reproduced identically from the RFC")
          PY

      # Compares token content, not whitespace: the committed file went through a
      # different formatter build than CI has, and indentation is not the thing
      # under test. If a vector, verdict or expected-string changes, this fails.
      - name: Regenerated test module is semantically identical
        shell: bash
        run: |
          cp rfc4475_test.mbt /tmp/committed_test.mbt
          python3 tools/gen_tests.py
          python3 - <<'PY'
          import re, sys
          def canonical(p):
              s = open(p, encoding='utf-8').read()
              return re.sub(r'\s+', '', s)
          a = canonical('/tmp/committed_test.mbt')
          b = canonical('rfc4475_test.mbt')
          if a != b:
              print("::error::rfc4475_test.mbt differs from generator output; run tools/gen_tests.py && moon fmt, then commit")
              # Show the first divergence to make the failure actionable.
              for i, (x, y) in enumerate(zip(a, b)):
                  if x != y:
                      print(f"first difference at char {i}: committed={a[i:i+60]!r} generated={b[i:i+60]!r}")
                      break
              sys.exit(1)
          print(f"generated test module matches the committed one ({len(a)} characters of code)")
          PY

  provenance:
    name: provenance and licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and NOTICE are present and specific
        shell: bash
        run: |
          set -e
          test -s LICENSE
          test -s NOTICE
          grep -q "Apache License" LICENSE
          grep -q "RFC 3261" NOTICE
          grep -q "RFC 4475" NOTICE
          echo "license and notice checks passed"

      - name: No RFC full text is bundled
        shell: bash
        run: |
          for f in rfc4475.txt rfc3261.txt; do
            if [ -e "$f" ]; then
              echo "::error::$f must not be committed; the reproduce step fetches it"
              exit 1
            fi
          done
          echo "no RFC full text committed"
